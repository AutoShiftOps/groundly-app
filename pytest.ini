[pytest]
# Only the fast, offline unit suite runs by default (`pytest` from repo
# root). The real-API suite (tests/backend/real_api/) is deliberately NOT
# on this path -- docs/TEST_COVERAGE_SPEC.md's own guidance is "don't mock
# away the real calls, but keep them out of every-commit CI"; run it
# explicitly with `pytest tests/backend/real_api` (see tests/README.md).
testpaths = tests/backend/unit
pythonpath = . backend
markers =
    real_api: hits real OpenAI/Tavily/Postgres -- costs money and time, never run implicitly by a bare `pytest` invocation.
