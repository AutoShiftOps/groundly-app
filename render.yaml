services:
  - type: web
    name: groundly-api
    env: python
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false   # paste your Supabase session-pooler connection string here in the Render dashboard
      - key: TAVILY_API_KEY
        sync: false   # optional -- live web-retrieval fallback; paste your Tavily key here in the Render dashboard
      - key: ALLOWED_ORIGIN
        value: https://your-app.vercel.app

# Note: database is hosted on Supabase (not Render Postgres), because Render's
# free Postgres tier hard-deletes data after 30 days + 14-day grace period.
# PYTHON_VERSION is required here because Render does NOT read runtime.txt
# (that is a Heroku convention) - it reads the PYTHON_VERSION env var instead.
